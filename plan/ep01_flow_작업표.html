<title>콩쥐팥쥐뎐 Flow 작업표</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Gowun+Dodum&display=swap">
<style>
/* 한지 위 먹과 붉은 직인: 휴대폰 한 손으로 위에서 아래로 내려가며 복사하는 작업표 */
:root{--bg:#EFE6D3;--paper:#F8F2E4;--ink:#221A13;--muted:#6E604E;--line:#D8CBB1;--seal:#A8321F;--sealfg:#FBF1DF;--done:#5E7A4A;
--brush:"East Sea Dokdo","Gowun Dodum",serif;--body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1C1814;--paper:#26211B;--ink:#EDE3D0;--muted:#A99A84;--line:#3B342B;--seal:#C9503A;--sealfg:#1C1814;--done:#8FB277;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1C1814;--paper:#26211B;--ink:#EDE3D0;--muted:#A99A84;--line:#3B342B;--seal:#C9503A;--sealfg:#1C1814;--done:#8FB277;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
h1{font-family:var(--brush);font-weight:400;font-size:clamp(44px,12vw,64px);line-height:1;margin:0;text-wrap:balance}
.seal{flex:none;width:52px;height:52px;background:var(--seal);color:var(--sealfg);border-radius:6px;display:grid;place-items:center;font-size:30px;font-weight:700;transform:rotate(-4deg);box-shadow:inset 0 0 0 4px var(--seal),inset 0 0 0 6px var(--sealfg)}
.guide{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.guide b{color:var(--seal)}
.guide a{color:var(--ink)}
.prog{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--done);width:0;transition:width .2s}
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.done{opacity:.55}
.card.redo{border:2px solid var(--seal)}
h2.sec{font-size:18px;margin:8px 0 0;color:var(--muted);text-wrap:balance}
.top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.id{font-family:var(--brush);font-size:30px;line-height:1;color:var(--seal)}
.tt{font-weight:700;font-size:17px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:2px 10px;color:var(--muted)}
.chip.h{border-color:var(--seal);color:var(--seal)}
.p{font-size:15px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;border-left:3px solid var(--line);padding-left:10px;max-height:9.6em;overflow:auto}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button{font-family:var(--body);font-size:15px;border-radius:8px;padding:9px 14px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
button.ghost{background:transparent;color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
label.ck{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

const KEY='ep01-flow-done';
let done={};try{done=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(done))}catch(e){}};
const toast=(t)=>{const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('on'),1400)};
async function copy(text,label,node){try{await navigator.clipboard.writeText(text);toast(label+' 복사됨')}catch(e){const r=document.createRange();r.selectNodeContents(node);const s=getSelection();s.removeAllRanges();s.addRange(r);toast('글자를 길게 눌러 복사하세요')}}
function prog(){const R=ROWS.filter(r=>r.redo);const n=R.filter(r=>done[r.id]).length;document.getElementById('cnt').textContent='다시 만들기 '+n+' / '+R.length+' 완료';document.getElementById('fill').style.width=(n/R.length*100)+'%'}
const list=document.getElementById('list');
ROWS.forEach(r=>{
 if(r.redo&&!window._h1){window._h1=1;const h=document.createElement('h2');h.className='sec';h.textContent='다시 만들기 3장 (블라인드 검수 반영)';list.appendChild(h)}
 if(!r.redo&&!window._h2){window._h2=1;const h=document.createElement('h2');h.className='sec';h.textContent='처음 14장 (완료, 참고용)';list.appendChild(h)}
 const c=document.createElement('article');c.className='card'+(done[r.id]?' done':'')+(r.redo?' redo':'');
 c.innerHTML='<div class="top"><span class="id"></span><span class="tt"></span></div><div class="chips"><span class="chip r"></span><span class="chip c"></span></div><div class="p"></div><div class="acts"><button class="bp">프롬프트 복사</button><button class="ghost bf">파일 이름 복사</button><label class="ck"><input type="checkbox"> 완료</label></div>';
 c.querySelector('.id').textContent=r.id;c.querySelector('.tt').textContent='컷 '+r.cut+' · '+r.title;
 const rc=c.querySelector('.r');rc.textContent=r.ratio==='가로'?'가로 16:9':'세로 9:16';if(r.ratio==='가로')rc.classList.add('h');
 c.querySelector('.c').textContent='캐릭터: '+r.chars;
 const p=c.querySelector('.p');p.textContent=r.prompt;
 c.querySelector('.bp').addEventListener('click',()=>copy(r.prompt,r.id+' 프롬프트',p));
 const fn=document.createElement('span');fn.textContent=r.file;
 c.querySelector('.bf').addEventListener('click',()=>copy(r.file,'파일 이름 '+r.file,fn));
 const cb=c.querySelector('input');cb.id='done-'+r.id;cb.checked=!!done[r.id];
 cb.addEventListener('change',()=>{done[r.id]=cb.checked;c.classList.toggle('done',cb.checked);save();prog()});
 list.appendChild(c)});
prog();
</script>
